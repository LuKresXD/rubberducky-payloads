version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Hold ALL major bumps (they've broken the build before); handled manually.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Hold Next entirely (major upgrade tracked manually) so it stays out of the
      # grouped security PR and doesn't block the safe fixes.
      - dependency-name: "next"
